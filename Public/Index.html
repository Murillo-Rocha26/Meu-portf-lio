<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murillo Rocha Robaina</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont/tabler-icons.min.css">
    <link rel="stylesheet" href="app.css">
    <link rel="stylesheet" href="about.css">
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="animations.css">
</head>
<body>

    <div class="glow"></div>

    <header>
        <div class="titulo">
            <h1>Murillo Rocha Robaina</h1>
            <h2>Dev junior</h2>
        </div>
    </header>

    <main class="home-content">
        <p class="greeting">Olá, eu me</p>
        <h1 class="my-name">chamo Murillo Rocha Robaina</h1>
        <p class="role" id="typewriter"></p>
    </main>

    <section class="container">

        <div class="card active" id="card1">
            <div class="card-inner">
                <div class="card-icons">
                    <div class="icon-wrap" data-tooltip="Home" onclick="window.location.href='index.html'">
                        <i class="ti ti-home" aria-label="Home"></i>
                    </div>
                    <div class="icon-wrap active-icon" data-tooltip="About" onclick="window.location.href='about.html'">
                        <i class="ti ti-user" aria-label="Perfil"></i>
                    </div>
                    <div class="icon-wrap" data-tooltip="Contact" onclick="window.location.href='contact.html'">
                        <i class="ti ti-mail" aria-label="Contato"></i>
                    </div>
                    <div class="icon-wrap" data-tooltip="Projects" onclick="window.location.href='projects.html'">
                        <i class="ti ti-layout-dashboard" aria-label="Projetos"></i>
                    </div>
                    <div class="icon-wrap" data-tooltip="Skills" onclick="window.location.href='skills.html'">
                        <i class="ti ti-columns" aria-label="Skills"></i>
                    </div>
                </div>
                <button id="next" title="Próximo"><i class="ti ti-arrow-right"></i></button>
            </div>
        </div>

        <div class="card" id="card2">
            <div class="card-inner">
                <div class="card-icons">
                    <div class="icon-wrap" data-tooltip="Profile">
                        <button class="click" onclick= "AbrirNovaJanela()">
                            <i class="ti ti-brand-github" aria-label="GitHub"></i>
                        </button>
                    </div>
                    <div class="icon-wrap" data-tooltip="CV">
                        <button class="click" onclick="AbrirJanela()">
                            <i class="ti ti-file-cv" aria-label="Currículo"></i>
                        </button>
                    </div>
                </div>
                <button id="prev" title="Anterior"><i class="ti ti-arrow-left"></i></button>
            </div>
        </div>

    </section>

    <script src="app.js"></script>
</body>
</html>
